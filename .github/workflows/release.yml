name: Release

# Every push to main builds the Mac app as a downloadable Actions artifact.
# A version tag (v1.2.3, matching package.json) also publishes a GitHub release
# with the disk images, which installed copies of Stow offer as an update.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) { console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package.json version ' + require('./package.json').version); process.exit(1) }"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the Mac app
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Stow-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Stow-mac
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: |
            Download the disk image for your Mac: **arm64** for Apple silicon, **x64** for Intel. Open it and drag Stow to Applications.

            Stow is not notarized by Apple yet, so clear the download flag once before the first launch:

            ```
            xattr -cr /Applications/Stow.app
            ```

            Copies of Stow that are already installed offer this release from the Update button in the header.
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Stow $GITHUB_REF_NAME" --notes "$NOTES" --generate-notes
