name: Release

# Pushes to main and tauri typecheck and test. Disk images are built on main
# and on a version tag. A tag (v1.2.3, matching package.json) also publishes
# a GitHub release. The tauri branch does not publish.
on:
  push:
    branches: [main, tauri]
    tags: ['v*']
  pull_request:
    branches: [main, tauri]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) { console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package.json version ' + require('./package.json').version); process.exit(1) }"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      # Signs with the Developer ID certificate and notarizes with the App Store
      # Connect API key when the secrets are there. A version tag must be signed.
      - name: Prepare macOS signing
        id: macsign
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$MAC_CERT_P12_BASE64" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Signing secrets are missing; a release must be signed and notarized."
              exit 1
            fi
            echo "::warning::Signing secrets are missing; building with an ad hoc signature."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "api_key=$key" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build the Mac app (signed and notarized)
        if: steps.macsign.outputs.signed == 'true'
        run: >-
          npm run dist --
          --config "{\"bundle\":{\"macOS\":{\"signingIdentity\":\"$APPLE_SIGNING_IDENTITY\"}}}"
        env:
          CI: true
          APPLE_SIGNING_IDENTITY: 'Developer ID Application: Thilagarajan Kamarajan (${{ secrets.APPLE_TEAM_ID }})'
          APPLE_API_KEY_PATH: ${{ steps.macsign.outputs.api_key }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Build the Mac app (ad hoc signature)
        if: steps.macsign.outputs.signed != 'true'
        run: npm run dist
        env:
          CI: true
      # An unsealed bundle makes macOS call the downloaded app damaged.
      - name: Check the app signature
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/Stow.app
      - name: Check Developer ID signature and notarization
        if: steps.macsign.outputs.signed == 'true'
        run: |
          app=src-tauri/target/release/bundle/macos/Stow.app
          codesign -dv "$app" 2>&1 | grep -q 'TeamIdentifier=${{ secrets.APPLE_TEAM_ID }}'
          xcrun stapler validate "$app"
          spctl --assess --type execute -vv "$app" 2>&1 | tee /dev/stderr | grep -q 'source=Notarized Developer ID'
      # The in-app updater downloads this zip, unpacks it, and swaps it in for the running app.
      - name: Zip the app for in-app updates
        run: |
          version=$(node -p "require('./package.json').version")
          arch=$(uname -m | sed 's/^arm64$/aarch64/')
          ditto -c -k --keepParent src-tauri/target/release/bundle/macos/Stow.app "src-tauri/target/release/bundle/dmg/Stow_${version}_${arch}.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Stow-mac
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.app.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Stow-mac
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: |
            Download the disk image for your Mac: **aarch64** for Apple silicon, **x86_64** for Intel. Open it and drag Stow to Applications.

            Stow is signed and notarized by Apple, so it opens like any other app.

            Copies of Stow that are already installed offer this release from the Update button in the header, and install it with a restart.
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Stow $GITHUB_REF_NAME" --notes "$NOTES" --generate-notes
