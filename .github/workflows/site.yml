name: Website

# Builds site/ (Astro) and publishes it with GitHub Pages at
# https://kthilagarajan.github.io/stow/. Runs when the site, the screenshots or
# the icon change on main. Needs Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/screenshots/**
      - build/icon.png
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # GitHub Pages needs a public repository on the free plan; skip quietly until then.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Astro needs a newer Node 22 than the runner's cached one; 24 is current LTS.
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
