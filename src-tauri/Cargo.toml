[package]
name = "stow"
version = "0.1.0"
description = "See what your Mac is holding, and what it can let go."
authors = ["kthilagarajan"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "stow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
rusqlite = { version = "0.37", features = ["bundled"] }
trash = "5"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "json", "rustls-tls", "stream", "system-proxy"] }
futures-util = "0.3"
libc = "0.2"
rayon = "1.10"

# Walking a disk in an unoptimised build is several times slower, which `tauri dev` hides behind loaders.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
